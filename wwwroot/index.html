<!doctype html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <title>Tint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="icons/tint.svg">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>
  <a class="skip-link" href="#scroller">Skip to library</a>
  <div id="app">
    <div id="titlebar" hidden>
      <div class="tb-drag" id="tb-drag">
        <svg class="tb-icon" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true">
          <g transform="translate(2 2)">
            <path d="M124 126 V42 C124 37 129 34 134 37 C158 52 190 69 200 103 C205 120 201 137 191 150 C192 132 186 115 171 103 C161 95 152 90 146 87 V126 Z" fill="currentColor"/>
            <rect x="117" y="134" width="36" height="15" rx="5" fill="currentColor" opacity="0.54"/>
            <path class="tb-icon-tip" d="M117 157 H153 C162 185 147 219 116 223 C91 226 70 214 58 197 C68 194 74 186 78 175 C84 160 99 157 117 157 Z" fill="var(--accent)"/>
          </g>
        </svg>
        <span class="tb-title" id="tb-title">Tint</span>
      </div>
      <div class="tb-controls">
        <button id="tb-min" class="tb-btn" type="button" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
        <button id="tb-max" class="tb-btn" type="button" aria-label="Maximize" title="Maximize">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1" stroke="currentColor" stroke-width="1.15" fill="none"/></svg>
        </button>
        <button id="tb-close" class="tb-btn tb-close" type="button" aria-label="Close" title="Close">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 2.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </div>

    <aside id="deck" aria-label="Now playing">
      <div class="deck-top">
        <div class="deck-art" id="deck-art">
          <svg class="sleeve-empty" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="30" /><circle cx="50" cy="50" r="5" />
          </svg>
        </div>

        <div class="deck-meta">
          <div class="deck-text">
            <p id="deck-title">Nothing playing</p>
            <p id="deck-title-english" lang="en" hidden></p>
            <div class="deck-by">
              <span id="deck-source" class="source-icon" role="img" hidden></span>
              <p id="deck-artist">Choose an album or a song to start.</p>
            </div>
          </div>
          <div class="deck-actions">
            <button id="b-like" class="icon-btn small" aria-label="Like" aria-pressed="false" title="Like" hidden></button>
            <button id="b-lyrics" class="icon-btn small" aria-label="Lyrics" title="Lyrics" hidden></button>
            <button id="b-share" class="icon-btn small" aria-label="Share YouTube Music link" title="Share YouTube Music link" hidden></button>
          </div>
        </div>

        <div class="scrub">
          <input type="range" id="seek" class="slider" min="0" max="1000" value="0" step="1" aria-label="Position in song" disabled>
          <div class="times"><span id="t-now">0:00</span><span id="t-format"></span><span id="t-left">0:00</span></div>
        </div>

        <div class="transport">
          <button id="b-shuffle" class="icon-btn toggle" aria-label="Shuffle" aria-pressed="false" title="Shuffle"></button>
          <button id="b-prev" class="icon-btn" aria-label="Previous song" title="Previous"></button>
          <button id="b-play" class="play-btn" aria-label="Play" title="Play"></button>
          <button id="b-next" class="icon-btn" aria-label="Next song" title="Next"></button>
          <button id="b-repeat" class="icon-btn toggle" aria-label="Repeat" aria-pressed="false" title="Repeat"></button>
        </div>

        <div class="volume">
          <button id="b-mute" class="icon-btn small" aria-label="Mute" title="Mute"></button>
          <input type="range" id="vol" class="slider" min="0" max="100" value="80" step="1" aria-label="Volume">
          <button id="b-expand" class="icon-btn small only-mini" aria-label="Open library" title="Open library"></button>
        </div>
      </div>

      <section class="upnext" aria-label="Up next">
        <header>
          <h2>Up next</h2>
          <button id="b-clear" class="text-btn" hidden>Clear</button>
        </header>
        <ol id="queue"></ol>
        <p id="queue-empty" class="quiet">Songs you line up will show here.</p>
      </section>
    </aside>

    <main id="browse">
      <header id="bar">
        <button id="b-back" class="icon-btn" aria-label="Back" title="Back"></button>
        <nav id="tabs" aria-label="Library">
          <a href="#/home" id="tab-start" class="tab-icon" aria-label="Home" title="Home"></a>
          <a href="#/albums">Albums</a>
          <a href="#/songs">Songs</a>
          <a href="#/playlists">Playlists</a>
          <a href="#/listen" id="tab-home" hidden>Listen now</a>
          <span id="tab-ink" aria-hidden="true"></span>
        </nav>
        <label class="search">
          <span class="search-icon" id="search-icon"></span>
          <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search your music">
        </label>
        <button id="b-mini" class="icon-btn" aria-label="Mini player" title="Mini player"></button>
        <a href="#/settings" id="b-settings" class="icon-btn" aria-label="Settings" title="Settings"></a>
      </header>
      <div id="scroller" tabindex="-1">
        <div id="view"></div>
      </div>
    </main>

  </div>

  <div id="toasts" aria-live="polite"><div id="update" hidden></div></div>
  <audio id="audio" preload="auto"></audio>
  <script type="module" src="js/main.js"></script>
</body>
</html>
